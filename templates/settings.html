{% extends "base.html" %}
{% block content %}
<h2>设置</h2>

<form hx-post="/api/config/form" hx-target="#config-view" hx-swap="innerHTML">
    <fieldset>
        <legend>SophNet API Key</legend>
        <label>
            <input type="password" name="value" placeholder="输入 API Key" required>
            <input type="hidden" name="key" value="api_key">
        </label>
    </fieldset>
    <button type="submit">💾 保存 API Key</button>
</form>

<form hx-post="/api/config/form" hx-target="#config-view" hx-swap="innerHTML" style="margin-top:1rem">
    <fieldset>
        <legend>默认 LLM 模型</legend>
        <input type="hidden" name="key" value="preferred_llm_model">
        <select name="value">
            {% for m in llm_models %}
            <option value="{{ m }}" {% if saved_config.get('preferred_llm_model') == m %}selected{% endif %}>
                {{ m }}
            </option>
            {% endfor %}
        </select>
    </fieldset>
    <button type="submit">💾 保存</button>
</form>

<form hx-post="/api/config/form" hx-target="#config-view" hx-swap="innerHTML" style="margin-top:1rem">
    <fieldset>
        <legend>默认视频模型</legend>
        <input type="hidden" name="key" value="preferred_video_model">
        <select name="value">
            {% for m in video_models %}
            <option value="{{ m }}" {% if saved_config.get('preferred_video_model') == m %}selected{% endif %}>
                {{ m }}
            </option>
            {% endfor %}
        </select>
    </fieldset>
    <button type="submit">💾 保存</button>
</form>

<hr>
<h3>当前配置</h3>
<div id="config-view" hx-get="/api/config/view" hx-trigger="load" hx-swap="innerHTML">
    <p aria-busy="true">加载中...</p>
</div>
{% endblock %}
